<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Наш штаб">
<meta name="theme-color" content="#F4F2EF">
<meta name="format-detection" content="telephone=no">
<title>Наш штаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EF; --card:#FFFDFC; --ink:#1B2028; --mut:#8B857E; --line:#EAE5DF; --soft:#F6F3EF;
  --a:#2E7D6F; --b:#C9587B; --gold:#D39A3B; --blue:#4A6BC4; --violet:#6E5AC8; --orange:#D57B45; --danger:#BC4B3F;
  --both:#4A515C;
  --r:18px; --sh:0 1px 2px rgba(27,32,40,.04), 0 8px 24px rgba(27,32,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,sans-serif;font-size:14.5px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,textarea,select{-webkit-appearance:none;appearance:none;border-radius:0;touch-action:manipulation}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}

.top{position:sticky;top:0;z-index:20;background:rgba(244,242,239,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.topin{display:flex;align-items:center;justify-content:space-between;gap:10px}
.date{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut)}
.title{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:1px 0 0}
.icon{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--mut);flex-shrink:0}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sync{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-left:8px}
.sync i{width:6px;height:6px;border-radius:99px;background:var(--mut)}
.sync.on i{background:var(--a)}

.card{background:var(--card);border-radius:16px;padding:13px;margin-bottom:9px;box-shadow:var(--sh);border:1px solid rgba(234,229,223,.7)}
.card h2{font-size:14px;font-weight:800;letter-spacing:-.01em;margin:0 0 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span.n{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:400;color:var(--mut)}

.hero{border-radius:22px;padding:17px;color:#F1EFEA;background:linear-gradient(140deg,#20262F 0%,#2A5C52 55%,#4A3B63 100%);box-shadow:0 12px 30px rgba(32,38,47,.24);margin-bottom:12px}
.hero .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#A6BDB6}
.hero h3{font-family:'Unbounded',sans-serif;font-weight:500;font-size:17px;margin:4px 0 0;letter-spacing:-.01em}
.hero .lines{margin-top:10px;display:grid;gap:7px}
.hline{display:flex;gap:9px;align-items:baseline;font-size:13.5px;color:#DFE6E2}
.hline i{width:7px;height:7px;border-radius:99px;flex-shrink:0;transform:translateY(-1px)}
.hline .hh{font-family:'JetBrains Mono',monospace;font-size:12px;color:#9FBAB5;white-space:nowrap}
.hero .none{color:#A6BDB6;font-size:13.5px;margin-top:12px}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
.quick.q6{grid-template-columns:repeat(4,1fr)}
.quick.q6 .qb{padding:9px 4px;font-size:10.5px;gap:4px}
.quick.q6 .qb svg{width:17px;height:17px}
@media (min-width:560px){.quick.q6{grid-template-columns:repeat(6,1fr)}}
.qb{background:var(--card);border:0;border-radius:14px;padding:10px 6px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.qb svg{width:20px;height:20px;fill:none;stroke:var(--a);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:7px}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:12px;background:var(--soft);font-size:16px;min-height:38px}
input[type=date],input[type=time]{min-width:0}
input[type=color]{-webkit-appearance:none;border:1px solid var(--line);border-radius:10px;padding:0}
input:focus,textarea:focus{border-color:var(--a);background:#fff;outline:none}
textarea{font-size:12.5px;font-family:'JetBrains Mono',monospace;min-height:96px;resize:vertical}
.add{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}
.add:hover{background:#0A0F16}.add[disabled]{opacity:.45}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--mut);font-weight:600}
.amt{font-family:'JetBrains Mono',monospace;font-weight:700;white-space:nowrap}
.inl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12.5px;color:var(--a);white-space:nowrap;margin-left:4px}
.sub{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);font-size:13.5px;padding:4px 0}
.hint{font-size:11.5px;color:var(--mut);margin:3px 0 7px}

.seg{display:flex;background:var(--soft);border-radius:12px;padding:2px;gap:2px;flex-shrink:0}
.seg button{border:0;background:transparent;padding:8px 10px;font-size:13px;font-weight:700;color:var(--mut);border-radius:11px}
.seg button[data-on="1"][data-p="a"]{background:var(--a);color:#fff}
.seg button[data-on="1"][data-p="b"]{background:var(--b);color:#fff}
.seg button[data-on="1"][data-p="n"]{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--soft);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--mut)}
.chip[data-on="1"]{background:var(--ink);color:#fff}

.item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.who{width:3px;align-self:stretch;border-radius:99px;flex-shrink:0}
.who.a{background:var(--a)}.who.b{background:var(--b)}.who.n{background:var(--line)}
.t{font-weight:500}
.done .t{text-decoration:line-through;color:var(--mut)}
.x{border:0;background:transparent;color:#C3CBD8;font-size:17px;line-height:1;padding:3px}
.x:hover{color:var(--danger)}
.chk{width:22px;height:22px;border:1.5px solid var(--line);border-radius:8px;background:#fff;flex-shrink:0;margin-top:1px;color:#fff;font-size:13px;line-height:20px;text-align:center}
.chk[data-on="1"]{background:var(--a);border-color:var(--a)}
.tag{display:inline-block;font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:99px;color:#fff}
.time{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;min-width:52px}
.time small{display:block;font-weight:400;color:var(--mut);font-size:10.5px}

.pbar{height:9px;border-radius:99px;background:#E9E4DD;overflow:hidden;margin:8px 0 6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#3FB39C);transition:width .45s}
.pbar.over i{background:var(--danger)}
.pbar.full i{background:linear-gradient(90deg,var(--gold),#F0C46A)}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#E9E4DD;margin-top:10px}
.split i{display:block;transition:width .45s}
.split i.a{background:var(--a)}.split i.b{background:var(--b)}
.legend{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--mut)}
.legend b{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink)}
.tot{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.warn{background:#FFF4E0;border-radius:14px;padding:11px 13px;font-size:12.5px;color:#6E5417;margin-bottom:12px}

.wk{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:11px 0 6px}
.day{display:grid;grid-template-columns:46px 1fr auto;gap:7px;align-items:center;margin-bottom:3px}
.dn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);text-transform:uppercase;line-height:1.15}
.dn b{display:block;font-weight:700;font-size:13px;color:var(--ink)}
.day.today .dn b{color:var(--gold)}
.nutri{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mut);margin:0 0 8px 59px}
.mday2{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px;background:var(--card)}
.mday2.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.mhead2{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.mhead2 b{font-size:13.5px;font-weight:800}
.mhead2 em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold)}
.mhead2 span{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mut)}
.mline{display:grid;grid-template-columns:64px 1fr auto auto auto;gap:6px;align-items:center;margin-bottom:4px}
.mlab{font-size:11px;font-weight:700;color:var(--mut)}
.mlab.opt{opacity:.6;font-weight:600}
.mline input{padding:7px 9px;font-size:13.5px;min-height:32px}
.steps{display:inline-flex;align-items:center;background:var(--soft);border-radius:9px;overflow:hidden}
.steps button{border:0;background:transparent;padding:6px 8px;font-size:14px;font-weight:800;color:var(--mut)}
.steps b{font-family:'JetBrains Mono',monospace;font-size:12px;min-width:16px;text-align:center}
.xs{border:0;background:transparent;color:#C6CBD3;font-size:14px;padding:4px}
.xs:hover{color:var(--danger)}
.mmeta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mut);margin:-1px 0 6px 70px}
.addsnack{border:1px dashed var(--line);background:transparent;border-radius:9px;padding:5px 10px;margin:0 0 5px 70px;
  font-size:11px;color:var(--mut);font-weight:600}
.mday{border-top:1px solid var(--line);padding:8px 0}
.mday:first-of-type{border-top:0}
.mhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.mhead b{font-weight:800}
.mhead span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mut)}
.mday.today .mhead b{color:var(--gold)}
.mrow{display:grid;grid-template-columns:26px 1fr auto 30px;gap:6px;align-items:center;margin-bottom:4px}
.ml{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--mut);text-transform:uppercase}
.mn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mut);text-align:right}
.mnu{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--mut);margin:-2px 0 5px 32px}
.mrow input{padding:7px 9px;font-size:13.5px}
.mrow.opt .ml{opacity:.6}
.mrow.opt input{background:transparent;border-style:dashed}
.pill.sm{padding:6px 8px;min-width:34px;font-size:11px}
.lnk{border:0;background:transparent;color:var(--a);font-weight:700;font-size:11px;padding:0 4px;text-decoration:underline}
.favc{display:inline-flex;align-items:center;background:var(--soft);border-radius:99px;overflow:hidden}
.favc button{border:0;background:transparent;padding:7px 4px 7px 12px;font-size:12.5px;font-weight:600;color:var(--mut)}
.favc.on{background:#E4EFEA}
.favc.on button{color:var(--a)}
.favc i{font-style:normal;color:var(--mut);padding:7px 10px 7px 4px;font-size:11px;cursor:pointer}
.fold{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--soft);border-radius:10px;
  padding:8px 11px;margin:10px 0 4px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);font-weight:700}
.fold u{text-decoration:none;background:var(--card);border-radius:99px;padding:1px 7px;font-size:10px}
.ctlbox{background:var(--soft);border-radius:12px;padding:8px;margin-bottom:10px}
.ctlbox .card{margin-bottom:7px;box-shadow:none;border:1px solid var(--line)}
.fold i{margin-left:auto;font-style:normal;font-size:12px}
.mrow .pill{padding:7px 9px;min-width:38px;font-size:11px}
.pill{border:0;background:var(--soft);border-radius:99px;padding:9px 11px;font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap;min-width:46px}
.pill[data-p="a"]{background:var(--a);color:#fff}.pill[data-p="b"]{background:var(--b);color:#fff}
.pill[data-on="1"]{background:var(--ink);color:#fff}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.nb{border:0;background:var(--soft);border-radius:12px;padding:8px 13px;color:var(--mut);font-weight:800}
.qty{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--mut);white-space:nowrap}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}

.tsel{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px 8px}
.tsel u{text-decoration:none;font-size:11px;color:var(--mut);margin-right:2px;font-family:'JetBrains Mono',monospace}
.tsel b{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--mut)}
.tsel select{border:0;background:transparent;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;
  color:var(--ink);padding:4px 2px;text-align:center;-webkit-appearance:none;appearance:none;min-width:34px}
.tsel select:focus{outline:none;color:var(--a)}
.tsel input{width:74px;font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;text-align:center;
  border:0;background:transparent;padding:4px 2px;color:var(--ink);min-height:auto}
.tsel input:focus{outline:none;color:var(--a)}
.modes{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.modes button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:12.5px;font-weight:700;color:var(--mut);border-radius:9px}
.modes button[data-on="1"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(27,32,40,.12)}
.fchip{display:inline-flex;align-items:center;gap:6px;opacity:.45}
.fchip[data-on="1"]{opacity:1}
.fchip i{width:8px;height:8px;border-radius:99px;display:block}
.gwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead,.gall{display:grid;background:var(--soft);border-bottom:1px solid var(--line)}
.gh{padding:6px 2px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--mut);
  text-transform:uppercase;border-left:1px solid var(--line);cursor:pointer}
.gh b{display:block;font-size:15px;color:var(--ink);font-weight:800;margin-top:2px}
.gh.today b{color:#fff;background:var(--danger);border-radius:99px;width:23px;height:23px;line-height:23px;margin:2px auto 0}
.gh.sel{background:#EDE7DF}
.alab{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--mut);text-align:right;padding:4px 4px 0;line-height:1.1}
.ga{border-left:1px solid var(--line);min-height:22px;padding:2px;display:flex;flex-direction:column;gap:2px}
.ac{font-size:9px;line-height:12px;color:#fff;border-radius:4px;padding:1px 4px;font-style:normal;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ac.tk{background:#C9C2B6}
.gbody{display:grid;max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.hgut{position:relative}
.hlab{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--ink);opacity:.75;text-align:right;
  padding-right:6px;border-top:1px solid var(--line);transform:translateY(-7px)}
.hgut{background:var(--soft)}
.dcol{position:relative;border-left:1px solid var(--line);height:1056px;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 43px,var(--line) 44px)}
.dcol.today{background-color:rgba(217,154,59,.06)}
.evt{position:absolute;border-radius:7px;padding:2px 4px;color:#fff;overflow:hidden;font-size:9.5px;line-height:11px;
  box-shadow:0 1px 4px rgba(27,32,40,.25);border:1.5px solid var(--card)}
.evt.nar{padding:2px;font-size:8.5px;line-height:10px}
.evt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt u{display:block;text-decoration:none;opacity:.85;font-family:'JetBrains Mono',monospace;font-size:8.5px}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:5}
.nowl::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:99px;background:var(--danger)}
.tgrid{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.ruler{display:grid;grid-template-columns:62px 1fr;background:var(--soft);border-bottom:1px solid var(--line);height:20px}
.ruler u{position:relative;text-decoration:none}
.ruler i{position:absolute;top:3px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  color:var(--mut);font-style:normal;transform:translateX(-50%)}
.drow2{display:grid;grid-template-columns:62px 1fr;border-top:1px solid var(--line);align-items:stretch}
.drow2:first-of-type{border-top:0}
.drow2.today{background:rgba(211,154,59,.07)}
.drow2.sel{background:var(--soft)}
.dl{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--mut);text-transform:uppercase;
  padding:6px 4px 4px 8px;line-height:1.15;border-right:1px solid var(--line)}
.dl b{display:block;font-size:13px;color:var(--ink);font-weight:800}
.dl u{text-decoration:none;font-size:9px;color:var(--mut)}
.drow2.today .dl b{color:var(--danger)}
.tl{position:relative;display:block;margin:4px 4px 4px 0}
.gl2{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.ev2{position:absolute;height:21px;border-radius:6px;background:var(--a);color:#fff;font-style:normal;
  overflow:hidden;box-shadow:0 1px 3px rgba(27,32,40,.22);border:1px solid var(--card)}
.ev2 b{display:block;font-size:9.5px;line-height:19px;font-weight:700;padding:0 5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ev2.allday{border-radius:3px;opacity:.9}
.nowv{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--danger);z-index:6}
.mask{position:fixed;inset:0;background:rgba(27,32,40,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(27,32,40,.3);max-height:86vh;overflow-y:auto}
@media (min-width:620px){.mask{align-items:center}.modal{border-radius:20px}}
.modal h3{margin:0 0 12px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.modal .mx{border:0;background:var(--soft);border-radius:10px;padding:6px 10px;color:var(--mut);font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mcell{min-height:66px;background:var(--soft);border-radius:9px;padding:4px 3px;font-size:11px;overflow:hidden}
.mcell b{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;display:block;margin-bottom:2px}
.mcell.out{opacity:.35}
.mcell.today b{color:#fff;background:var(--danger);border-radius:99px;width:18px;height:18px;line-height:18px;text-align:center}
.mcell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mcell i{display:block;font-style:normal;font-size:8.5px;line-height:11px;color:#fff;border-radius:3px;
  padding:1px 3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell u{font-size:8.5px;color:var(--mut);text-decoration:none}
.scale{display:grid;grid-template-columns:54px 1fr 26px;gap:9px;margin:2px 0 6px}
.scale u{display:flex;justify-content:space-between;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--mut)}
.drow{display:grid;grid-template-columns:50px 1fr 24px;gap:8px;align-items:center;width:100%;border:0;background:transparent;padding:3px 4px;margin:0 -4px;text-align:left;border-radius:12px}
.drow[data-sel="1"]{background:var(--soft)}
.drow.today .dlab b{color:var(--gold)}
.dlab{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mut);text-transform:uppercase;line-height:1.2}
.dlab b{display:block;font-size:12.5px;color:var(--ink)}
.track{position:relative;display:block;height:27px;background:var(--soft);border-radius:9px;overflow:hidden}
.drow[data-sel="1"] .track{background:#EFEAE3}
.gl{position:absolute;top:0;bottom:0;width:1px;background:#E4DFD8}
.sg{position:absolute;top:9px;height:16px;border-radius:6px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:9.5px;line-height:16px;padding:0 5px;white-space:nowrap;overflow:hidden;font-style:normal;box-shadow:0 1px 3px rgba(19,26,36,.15)}
.sg.all{top:2px;left:0;width:100%;height:8px;font-size:0;padding:0;opacity:.9;box-shadow:none}
.tsk{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--mut);text-align:right}
.dsum{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px 58px}
.dchip{font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:99px;background:var(--soft)}

/* звички */
.hrow{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hcells{display:flex;gap:5px}
.hc{width:30px;height:34px;border:0;border-radius:10px;background:var(--soft);color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.hc b{font-size:13px;line-height:1}
.hc[data-on="1"]{color:#fff}
.hc.tdy{box-shadow:inset 0 0 0 2px var(--gold)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:0;border-radius:15px;padding:13px;box-shadow:var(--sh);text-align:left}
.tile b{display:block;font-size:15px;font-weight:800;margin-bottom:3px}
.tile span{font-size:12.5px;color:var(--mut)}
.ans{background:#EFF4F1;border-left:3px solid var(--a);border-radius:0 10px 10px 0;padding:8px 11px;margin-top:7px;font-size:13.5px}
.logrow{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.logrow:first-of-type{border-top:0}
.logrow span{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mut)}
.cbtn{border:0;background:var(--soft);border-radius:11px;padding:7px 10px;font-size:13px;line-height:1;flex-shrink:0}
.cbtn.on{background:var(--ink);color:#fff}
.schedbox{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:7px}
.plan{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--a)}
.pava{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(0,0,0,.28)}
.pwrap{position:relative;flex-shrink:0}
.pwrap::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px dashed rgba(255,255,255,.3)}
.heroTop{display:flex;gap:15px;align-items:center}
.navava{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid var(--line)}
.homeava{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.45);flex-shrink:0}
.maplink{display:inline-block;font-size:11.5px;color:var(--a);text-decoration:none;font-weight:700;margin-top:3px}

.side{position:fixed;left:0;top:0;bottom:0;width:216px;background:#FBF9F6;border-right:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;
  z-index:41;-webkit-transform:translateX(-100%);transform:translateX(-100%);transition:transform .22s ease}
.side.open{-webkit-transform:none;transform:none;box-shadow:0 0 40px rgba(19,26,36,.2)}
.brand{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;padding:0 10px 14px;letter-spacing:-.01em}
.snav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 10px;
  border-radius:11px;font-size:13.5px;font-weight:600;color:var(--mut);text-align:left;margin-bottom:2px}
.snav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.snav button[aria-selected="true"]{background:#EDE7DF;color:var(--ink)}
.snav button[aria-selected="true"] svg{stroke:var(--a)}
.snav button span.c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mut)}
.sdiv{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:12px 10px 6px}
.backdrop{position:fixed;inset:0;background:rgba(19,26,36,.4);z-index:40;display:none}
.backdrop.on{display:block}
.burger{margin-right:10px}
@media (min-width:1000px){
  .side{-webkit-transform:none;transform:none;box-shadow:none}
  .backdrop{display:none!important}
  body{padding-left:216px}
  .burger{display:none}
}
@media (min-width:760px){
  .wrap{max-width:940px}
  #view{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  #view>.card{margin-bottom:0}
  #view>.hero,#view>.quick,#view>.grid2,#view>.warn,#view>.card.wide{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const RMODES=[['none','Разово'],['day','Щодня'],['week','Щотижня'],['nday','Через N днів'],['shift','Чергування'],['month','Щомісяця'],['year','Щороку']];
function occurs(c,d){
  const r=c.r||(c.rep?{mode:'year'}:{mode:'none'});
  if(r.mode==='year') return c.date.slice(5)===d.slice(5);
  if(d<c.date) return false;
  const diff=Math.round((new Date(d)-new Date(c.date))/864e5);
  if(r.mode==='day') return true;
  if(r.mode==='week') return diff%7===0;
  if(r.mode==='nday') return diff%Math.max(1,r.n||2)===0;
  if(r.mode==='month') return d.slice(8,10)===c.date.slice(8,10);
  if(r.mode==='shift'){const on=Math.max(1,r.on||2),off=Math.max(1,r.off||2);return diff%(on+off)<on}
  return diff===0;
}
function repLabel(c){
  const r=c.r||(c.rep?{mode:'year'}:{mode:'none'});
  if(r.mode==='none')return '';
  if(r.mode==='nday')return 'кожні '+(r.n||2)+' дн.';
  if(r.mode==='shift')return (r.on||2)+' через '+(r.off||2);
  return (RMODES.find(m=>m[0]===r.mode)||['','']) [1].toLowerCase();
}
function dayItems(d){
  const out=[];
  D.cal.forEach(c=>{
    if(occurs(c,d)){out.push({...c,carry:false});return}
    const night=!c.allDay&&c.end&&c.start&&c.end<c.start;
    if(night&&occurs(c,addDays(d,-1))) out.push({...c,carry:true});
  });
  return out.sort((x,y)=>(x.allDay?-1:0)-(y.allDay?-1:0)||String(x.start||'').localeCompare(String(y.start||'')));
}

function withTimeout(pr,ms){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))])}
async function pull(quick){
  if(cfg.url&&cfg.key){
    if(quick&&lastStamp){                       // дешева перевірка: тягнемо лише мітку часу
      try{const r0=await withTimeout(fetch(sbUrl('couple_state?id=eq.main&select=updated_at'),{headers:sbHead()}),7000);
        if(r0.ok){const j0=await r0.json(); online=true;
          const st=j0[0]&&j0[0].updated_at;
          if(!st||st===lastStamp) return null;  // нічого не змінилось — трафіку майже нуль
        }}catch(e){online=false}
    }
    try{const r=await withTimeout(fetch(sbUrl('couple_state?id=eq.main&select=data,updated_at'),{headers:sbHead()}),7000);
      if(!r.ok)throw 0; const j=await r.json(); online=true;
      if(j[0])lastStamp=j[0].updated_at||lastStamp;
      return j[0]?j[0].data:null;}
    catch(e){online=false; note='Supabase не відповідає — працюю на локальних даних.';}
  }
  try{const r=await store.get(KEY,SHARED); if(r&&r.value) return JSON.parse(r.value)}catch(e){}
  return null;
}
async function push(){
  if(cfg.url&&cfg.key){
    try{const r=await withTimeout(fetch(sbUrl('couple_state'),{method:'POST',headers:sbHead({Prefer:'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify({id:'main',data:D,updated_at:(lastStamp=new Date().toISOString())})}),7000);
      if(!r.ok)throw 0; online=true; badge(); return}
    catch(e){online=false; note='Supabase не приймає запис — зберігаю локально.'; badge()}
  }
  try{await store.set(KEY,JSON.stringify(D),SHARED)}
  catch(e){note='Не вдалося зберегти. Зміни щось іще раз.'}
}
function badge(){const b=$('#syncBadge'); if(!b)return;
  b.className='sync'+(cfg.url&&online?' on':''); b.lastElementChild.textContent=cfg.url?(online?'supabase':'офлайн'):'локально'}

function lg(text){D.log.unshift({id:id(),ts:new Date().toISOString(),text});D.log=D.log.slice(0,150)}
function snapState(){const c=Object.assign({},D);delete c.undo;delete c.redo;return JSON.stringify(c)}
function upd(fn,msg){
  const before=snapState();
  fn(); D.rev=Date.now(); if(msg)lg(msg);
  D.undo=(D.undo||[]).concat([{ts:new Date().toISOString(),text:msg||'зміна',state:before}]).slice(-8);
  D.redo=[]; save(); render();
}
function applyState(state,keepUndo,keepRedo){
  const o=JSON.parse(state); D=Object.assign(def(),o); D.undo=keepUndo; D.redo=keepRedo; save(); render();
}
function doUndo(i){
  const st=(D.undo||[]).slice(); if(!st.length)return;
  const idx=(i===undefined)?st.length-1:i, entry=st[idx]; if(!entry)return;
  const cur=snapState();
  const redo=(D.redo||[]).concat([{ts:new Date().toISOString(),text:entry.text,state:cur}]).slice(-8);
  applyState(entry.state, st.slice(0,idx), redo);
  note='Скасовано: '+entry.text; render();
}
function doRedo(){
  const rd=(D.redo||[]).slice(); const entry=rd.pop(); if(!entry)return;
  const cur=snapState();
  const un=(D.undo||[]).concat([{ts:new Date().toISOString(),text:entry.text,state:cur}]).slice(-8);
  applyState(entry.state, un, rd);
  note='Повернено: '+entry.text; render();
}

function monthly(){const m=today().slice(0,7),e=D.expenses.filter(x=>x.date.slice(0,7)===m);
  const a=e.filter(x=>x.who==='a').reduce((s,x)=>s+x.amount,0),b=e.filter(x=>x.who==='b').reduce((s,x)=>s+x.amount,0);
  const both=e.filter(x=>x.who==='n').reduce((s,x)=>s+x.amount,0);
  return{e,a:a+both/2,b:b+both/2,ownA:a,ownB:b,both,sum:a+b+both}}
function normTime(v){
  let x=String(v||'').replace(/[^0-9:]/g,'');
  if(/^\d{1,2}$/.test(x)) x=x.padStart(2,'0')+':00';
  else if(/^\d{3}$/.test(x)) x='0'+x[0]+':'+x.slice(1);
  else if(/^\d{4}$/.test(x)) x=x.slice(0,2)+':'+x.slice(2);
  const m=x.match(/^(\d{1,2}):(\d{1,2})$/);
  if(!m) return null;
  return String(Math.min(23,Number(m[1]))).padStart(2,'0')+':'+String(Math.min(59,Number(m[2]))).padStart(2,'0');
}

const mealAt=(d,k)=>((D.meals[d]||{})[k])||{dish:'',cook:''};
const nuOf=n=>n?D.nutri[n.toLowerCase().trim()]:null;
const R=()=>D.range&&D.range.from&&D.range.to&&D.range.to>=D.range.from?D.range:null;
function weekDays(){
  if(menuShift!==0){const st=addDays(monday(today()),menuShift*7);return Array.from({length:7},(_,i)=>addDays(st,i))}
  const r=R();
  const from=r?r.from:monday(today()), to=r?r.to:addDays(monday(today()),13);
  const out=[]; for(let d=from; d<=to&&out.length<45; d=addDays(d,1)) out.push(d);
  return out;
}
function planDays(){const w=weekDays(); return R()?w:w.filter(d=>d>=today())}

  const days=weekDays();
  const dayKcal=d=>SLOTS.reduce((s,[k])=>{const n=nuOf(mealAt(d,k).dish);return s+(n?n.kcal:0)},0);

  const byCat={}; D.shopping.forEach(x=>(byCat[x.cat||'Інше']=byCat[x.cat||'Інше']||[]).push(x));

      ${m.dish?`<button class="xs" data-act="mealDel" data-d="${d}" data-s="${k}" title="Прибрати">✕</button>`:''}
      </div>
      ${(z||m.base||pr>D.serv||m.keep)?`<div class="mmeta">
        ${z?`${z.g?z.g+' г · ':''}${z.kcal} ккал · Б${z.p} Ж${z.f} В${z.c}`:''}

        ${m.keep?` · стоїть до ${Math.max(1,Number(m.keep))} дн.`:''}

function applyMenu(o){
  const favOf=n2=>D.favs.find(f=>f.title.toLowerCase().trim()===String(n2||'').toLowerCase().trim().replace(/\s*\(залишки\)$/,''));
  const pick=(v,prev)=>{ if(!v)return null;
    if(typeof v==='string'){const fv=favOf(v);
      return {dish:v,cook:(prev||{}).cook||'',p:(fv&&fv.p)||D.serv,keep:(fv&&fv.keep)||KEEP_DEF}}
    const fv=favOf(v.dish);
    return {dish:String(v.dish||''),cook:(prev||{}).cook||'',
      p:Math.min(12,Math.max(1,Number(v.p)||(fv&&fv.p)||D.serv)),
      base:v.base?String(v.base):'', cooked:v.cook===false?false:true,
      keep:Math.min(7,Math.max(1,Number(v.keep)||(fv&&fv.keep)||KEEP_DEF))}};
  let n=0;(o.menu||[]).forEach(m=>{
    const d=String(m.date||'').slice(0,10); if(!d)return;
    const day=D.meals[d]||{};
    const b=pick(m.breakfast,day.b), l=pick(m.lunch,day.l), dn=pick(m.dinner,day.d);
    if(b)day.b=b; if(l)day.l=l; if(dn)day.d=dn;
    D.meals[d]=day;n++});
  if(Array.isArray(o.snacks)&&o.snacks.length)
    D.snacks=[...new Set(o.snacks.map(x=>String(x).trim()).filter(Boolean))].slice(0,20);
  const used=D.favs.filter(f=>f.on).length;
  D.favs.forEach(f=>f.on=false);            // галочки одноразові: зняли після складання меню
  const have=new Set(D.shopping.map(x=>x.text.toLowerCase().trim())); let b=0;
  (o.buy||[]).forEach(it=>{const t=String(it.item||'').trim(); if(!t||have.has(t.toLowerCase()))return;
    D.shopping.push({id:id(),text:t,qty:String(it.qty||''),cat:String(it.cat||'Інше'),done:false});have.add(t.toLowerCase());b++});
  (o.dishes||[]).forEach(d=>{const k=String(d.dish||'').toLowerCase().trim(); if(!k)return;
    D.nutri[k]={kcal:Math.round(d.kcal||0),g:Math.round(d.g||0),p:Math.round(d.p||0),f:Math.round(d.f||0),c:Math.round(d.c||0)}});
  lg(`Меню з холодильника: ${n} днів, докупити ${b} поз.`);
  note=`Меню на ${n} днів записано. Докупити ${b} позицій${o.fromHome?` — приблизно ${100-Number(o.fromHome)}% продуктів, решта вже вдома`:''}${(o.snacks||[]).length?`. Перекусів на вибір: ${(o.snacks||[]).length}`:''}${used?`. Галочки з ${used} улюблених знято.`:''}`;
  save();
}
async function askAi(prompt){
  const h={"Content-Type":"application/json"};
  const ak=AI_KEY||cfg.akey;
  if(ak){h['x-api-key']=ak;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true'}
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:3000,messages:[{role:"user",content:prompt}]})});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data=await res.json();
  return (data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n');
}

/* ---------- КАЛЕНДАР ---------- */
const HR=44, MINS=v=>Number(String(v).slice(0,2))*60+Number(String(v).slice(3,5));
function calDays(){
  if(calMode==='day') return [calAnchor];
  if(calMode==='week') return Array.from({length:7},(_,i)=>addDays(monday(calAnchor),i));
  const first=monday(iso(new Date(calAnchor.slice(0,7)+'-01')));
  return Array.from({length:42},(_,i)=>addDays(first,i));
}
function visible(x){ return !hidden.has(x.type) }
function layout(items){
  const ev=items.map(x=>{
    const s=x.carry?0:MINS(x.start);
    let e=x.carry?MINS(x.end):(x.end?MINS(x.end):MINS(x.start)+60);
    if(!x.carry&&x.end&&e<=s)e=1440;
    return {x:x,s:s,e:Math.max(e,s+30)};
  }).sort((p,q)=>p.s-q.s||p.e-q.e);
  // розбиваємо на групи, що реально перетинаються, і ділимо ширину лише всередині групи
  let group=[], groupEnd=-1;
  const close=()=>{
    if(!group.length)return;
    const lanes=[];
    group.forEach(o=>{let i=0; while(lanes[i]!==undefined&&lanes[i]>o.s)i++; lanes[i]=o.e; o.lane=i});
    const n=Math.max(1,lanes.length);
    group.forEach(o=>{o.w=100/n; o.l=o.lane*(100/n); o.n=n});
    group=[];
  };
  ev.forEach(o=>{ if(o.s>=groupEnd&&group.length)close(); group.push(o); groupEnd=Math.max(groupEnd,o.e) });
  close();
  return ev;
}
function timeGrid(days){
  const tsk={}; D.tasks.filter(t=>t.due&&!t.done).forEach(t=>(tsk[t.due]=tsk[t.due]||[]).push(t));
  const now=new Date(), nowL=(now.getHours()*60+now.getMinutes())/1440*100;
  const ruler=`<div class="ruler"><span></span><u>${[0,3,6,9,12,15,18,21].map(h=>
    `<i style="left:${h/24*100}%">${String(h).padStart(2,'0')}</i>`).join('')}<i style="left:100%;transform:translateX(-100%)">24</i></u></div>`;
  const rows=days.map(d=>{
    const all=dayItems(d).filter(x=>(x.allDay||!x.start)&&visible(x));
    const ev=layout(dayItems(d).filter(x=>!x.allDay&&x.start&&visible(x)));
    const lanes=ev.reduce((m,o)=>Math.max(m,o.lane+1),0);
    const hgt=Math.max(30,lanes*24+6), ts=tsk[d]||[];
    return `<div class="drow2 ${d===today()?'today':''} ${d===selDay?'sel':''}">
      <span class="dl" data-act="pick" data-d="${d}">${wd(d)}<b>${dm(d)}</b>${ts.length?`<u>☐${ts.length}</u>`:''}</span>
      <span class="tl" data-act="slot" data-d="${d}" style="height:${hgt}px">
        ${[3,6,9,12,15,18,21].map(h=>`<i class="gl2" style="left:${h/24*100}%"></i>`).join('')}
        ${all.map((x,k)=>`<i class="ev2 allday" style="left:0;width:100%;top:${k*10}px;height:8px;background:${colOf(x)}"
          data-act="evt" data-id="${x.id}" data-d="${d}" title="${esc(label(x))}"></i>`).join('')}
        ${ev.map(o=>{const l=o.s/1440*100, w=Math.max(3.5,(o.e-o.s)/1440*100);
          return `<i class="ev2" style="left:${l}%;width:${w}%;top:${o.lane*24+(all.length?10:0)}px;background:${colOf(o.x)}"
            data-act="evt" data-id="${o.x.id}" data-d="${d}" title="${esc(timeStr(o.x)+' '+label(o.x))}">
            <b>${o.x.carry?'':o.x.start+' '}${esc(o.x.note||tName(o.x.type))}</b></i>`}).join('')}
        ${d===today()?`<i class="nowv" style="left:${nowL}%"></i>`:''}
      </span></div>`}).join('');
  return `<div class="tgrid">${ruler}${rows}</div>`;
}

function notifTick(){
  if(!notifOn())return;
  const now=new Date(), t=today(), lead=Number((cfg.notif||{}).lead||30);
  dayItems(t).forEach(x=>{
    if(x.allDay||!x.start||x.carry)return;
    const hm=x.start.split(':'), when=new Date(); when.setHours(Number(hm[0]),Number(hm[1]),0,0);
    const diff=(when-now)/60000, key=t+'|'+x.id+'|'+x.start;
    if(diff<=lead&&diff>-1&&!fired.has(key)){fired.add(key);
      try{new Notification((x.note||tName(x.type))+' — через '+Math.max(0,Math.round(diff))+' хв',
        {body:timeStr(x)+' · '+whoName(x.who),tag:key})}catch(e){}}
  });
  const dk='digest|'+t;
  if(now.getHours()===8&&!fired.has(dk)){fired.add(dk);
    const it=dayItems(t), tk=D.tasks.filter(z=>!z.done&&z.due===t);
    if(it.length||tk.length){try{new Notification('План на сьогодні',
      {body:it.map(i=>timeStr(i)+' '+(i.note||tName(i.type))).concat(tk.map(z=>'☐ '+z.text)).slice(0,6).join('\n'),tag:dk})}catch(e){}}}
}
setInterval(notifTick,60000);

function icsEsc(v){return String(v||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function buildICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//nash-shtab//UA','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const dt=(d,t)=>d.replace(/-/g,'')+(t?'T'+t.replace(':','')+'00':'');
  const ev=(uid,date,start,end,sum,rule)=>{
    const endDate=(start&&end&&end<start)?addDays(date,1):date;
    L.push('BEGIN:VEVENT','UID:'+uid+'@nashshtab','DTSTAMP:'+dt(today(),'000000'));
    if(start){L.push('DTSTART:'+dt(date,start),'DTEND:'+dt(endDate,end||start))}
    else{L.push('DTSTART;VALUE=DATE:'+dt(date),'DTEND;VALUE=DATE:'+dt(addDays(date,1)))}
    if(rule)L.push('RRULE:'+rule);
    L.push('SUMMARY:'+icsEsc(sum),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(sum),
      'TRIGGER:'+(start?'-PT30M':'-PT12H'),'END:VALARM','END:VEVENT');
  };
  D.cal.forEach(c=>{
    const sum=(c.note||tName(c.type))+(c.who!=='n'?' ('+whoName(c.who)+')':'');
    const r=c.r||(c.rep?{mode:'year'}:{mode:'none'});
    if(r.mode==='shift'){
      let n=0; for(let i=0;i<120&&n<60;i++){const d=addDays(c.date,i); if(occurs(c,d)){ev(c.id+'-'+i,d,c.start,c.end,sum,'');n++}}
    }else{
      const rule=r.mode==='day'?'FREQ=DAILY':r.mode==='week'?'FREQ=WEEKLY':
        r.mode==='nday'?'FREQ=DAILY;INTERVAL='+Math.max(1,r.n||2):r.mode==='month'?'FREQ=MONTHLY':r.mode==='year'?'FREQ=YEARLY':'';
      ev(c.id,c.date,c.start,c.end,sum,rule);
    }
  });
  D.tasks.filter(x=>x.due&&!x.done).forEach(x=>ev(x.id,x.due,'','','☐ '+x.text+' ('+whoName(x.who)+')',''));
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function downloadICS(){
  try{
    const blob=new Blob([buildICS()],{type:'text/calendar;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='nash-shtab.ics'; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    note='Файл .ics завантажено — імпортуй його в Google Calendar, і нагадування прийдуть навіть із закритим застосунком.';
  }catch(e){note='Не вдалося зібрати файл: '+e.message}
  render();
}

const ACTS=[[1.2,'сидяча'],[1.375,'легка'],[1.55,'середня'],[1.725,'висока']];
const AIMS=[['loss','Схуднення'],['keep','Підтримка'],['gain','Набір']];
function bioCalc(k){
  const b=((D.bio||{})[k])||{}, w=Number(b.w), h=Number(b.h), age=Number(b.age)||30;
  if(!w||!h) return null;
  const bmr=10*w+6.25*h-5*age+(b.sex==='f'?-161:5);
  const tdee=bmr*(Number(b.act)||1.375);
  const aim=b.aim||'keep';
  let target=aim==='loss'?tdee*0.82:aim==='gain'?tdee*1.12:tdee;
  const floor=b.sex==='f'?1300:1600, capped=target<floor;
  if(capped)target=floor;
  const pr=Math.round(w*(aim==='loss'?1.9:1.6)), f=Math.round(w*0.9);
  const c=Math.max(40,Math.round((target-pr*4-f*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),target:Math.round(target),p:pr,f:f,c:c,capped:capped,aim:aim,w:w};
}

      <div class="chips grow">${ACTS.map(([v,n])=>`<button class="chip" data-on="${Number(b.act||1.375)===v?1:0}" data-act="bioAct" data-k="${k}" data-v="${v}">${n}</button>`).join('')}</div></div>
    <div class="row"><div class="chips grow">${AIMS.map(([v,n])=>`<button class="chip" data-on="${(b.aim||'keep')===v?1:0}" data-act="bioAim" data-k="${k}" data-v="${v}">${n}</button>`).join('')}</div>
      <button class="add" data-act="bioSave" data-k="${k}">Зберегти</button></div>
    ${r?`<div class="tot" style="border-top:0;padding-top:6px"><span>Витрата за день</span><span class="amt">${r.tdee} ккал</span></div>
      <div class="row" style="justify-content:space-between"><span class="sub">Ціль: ${AIMS.find(x=>x[0]===r.aim)[1].toLowerCase()}</span>
        <span class="amt" style="font-size:19px">${r.target} ккал</span></div>

      ${r.capped?'<div class="hint">Дефіцит обмежено знизу — нижче цієї межі різати калорії без лікаря не варто.</div>':''}

    Якщо запит блокується (буває всередині чату), застосунок працює на локальному сховищі; повний Supabase запрацює, коли відкриєш файл із диска або з хостингу.</div></div>
  <div class="card"><h2>Сповіщення <span class="n">${typeof Notification==='undefined'?'не підтримується':(Notification.permission==='granted'?((cfg.notif||{}).on?'увімкнено':'вимкнено'):'немає дозволу')}</span></h2>
    <div class="row"><button class="add grow" data-act="notifAsk">Дозволити сповіщення</button>
      <button class="ghost" data-act="notifToggle">${(cfg.notif||{}).on?'Вимкнути':'Увімкнути'}</button></div>
    <div class="row"><span class="sub">Попереджати за</span><div class="chips grow">${[15,30,60].map(v=>
      `<button class="chip" data-on="${Number((cfg.notif||{}).lead||30)===v?1:0}" data-act="notifLead" data-v="${v}">${v} хв</button>`).join('')}</div>
      <button class="ghost" data-act="notifTest">Тест</button></div>

    Закритий файл нічого надіслати не може — для нагадувань цілодобово експортуй календар нижче.</div></div>
  <div class="card"><h2>Експорт у календар</h2>
    <div class="row"><button class="add grow" data-act="ics">Завантажити .ics</button></div>
    <div class="hint">Усі події з повторами й чергуванням плюс справи з дедлайном. Імпортуєш у Google Calendar (Налаштування → Імпорт) чи Apple Calendar — і телефон нагадуватиме сам, за 30 хв до події. Повторне завантаження після змін оновлює записи.</div></div>
  <div class="card"><h2>Ключ Anthropic <span class="n">${cfg.akey?'збережено':'не задано'}</span></h2>
    <div class="row"><input type="text" id="akey" class="grow" value="${esc(cfg.akey||'')}" placeholder="sk-ant-… (необов'язково)"><button class="add" data-act="saveAkey">Зберегти</button></div>
    <div class="hint">Потрібен лише щоб кнопка «Скласти список» працювала поза чатом. Без ключа користуйся «Копіювати запит» — це безкоштовно.</div></div>
  ${(()=>{const raw=JSON.stringify(D).length, un=JSON.stringify(D.undo||[]).length;
    const kb=n=>n>1024*1024?(n/1048576).toFixed(1)+' МБ':Math.round(n/1024)+' КБ';
    return `<div class="card"><h2>Розмір даних <span class="n">${kb(raw)}</span></h2>
    <div class="sub">З них історія скасувань ${kb(un)} · журнал ${D.log.length} записів</div>
    <div class="pbar" style="margin-top:8px"><i style="width:${Math.min(100,raw/5242880*100)}%"></i></div>
    <div class="hint">Безкоштовний Supabase дає 500 МБ бази й 5 ГБ трафіку на місяць. За таких обсягів вистачить на роки.
    Якщо колись стане тісно — очисти журнал у розділі «Журнал».</div></div>`})()}
  <div class="card"><h2>Дані</h2>
    <div class="row"><button class="add grow" data-act="expJson">Зберегти копію (.json)</button>
      <button class="ghost" data-act="impPick">Відновити з копії</button></div>
    <input type="file" id="impFile" accept="application/json,.json" style="display:none">
    <div class="hint">Копія містить усе: гроші, меню, календар, холодильник, рецепти, журнал.
    Роби її раз на тиждень — це страховка, незалежна від бази.</div>
    <div class="row" style="margin-top:8px"><button class="ghost grow" data-act="wipe">Очистити все</button></div></div>`;
}

/* ---------- каркас ---------- */
function modalView(){
  const m=modalDraft; if(!m)return '';
  return `<div class="mask" data-act="mClose"><div class="modal" data-act="mStop">
    <h3>Подія ${dm(m.date)} <button class="mx" data-act="mClose">✕</button></h3>
    <div class="row"><input type="text" id="mNote" class="grow" value="${esc(m.note||'')}" placeholder="Підпис"></div>
    <div class="row"><div class="chips grow">${tList().map(t=>`<button class="chip" data-on="${m.type===t.k?1:0}" data-act="mType" data-v="${t.k}"
      style="${m.type===t.k?'background:'+colOf({type:t.k,who:m.who})+';color:#fff':''}">${esc(t.name)}</button>`).join('')}</div></div>
    <div class="row"><button class="pill" data-on="${m.allDay?1:0}" data-act="mAll" style="padding:11px 13px">Весь день</button>
      ${m.allDay?'':`${timeSel('mS',m.start,'з')} ${timeSel('mE',m.end,'до')}`}</div>
    <div class="row">${segWho(m.who,'mWho',true)}<input type="number" inputmode="decimal" id="mAmt" class="grow" value="${m.amt||''}" placeholder="Сума, Kč"></div>
    <div class="row"><input type="date" id="mDate" class="grow" value="${m.date}">
      <div class="chips">${RMODES.slice(0,3).concat([RMODES.find(r=>r[0]==='month')]).map(([k,n])=>
        `<button class="chip" data-on="${m.rMode===k?1:0}" data-act="mRep" data-v="${k}">${n}</button>`).join('')}</div></div>
    <div class="row" style="margin-top:10px"><button class="add grow" data-act="mSave">Зберегти</button>
      <button class="ghost" data-act="mDel" style="color:var(--danger)">Видалити</button></div>
    ${m.amt?`<div class="row"><button class="ghost grow" data-act="mPay">Записати ${kc(m.amt)} у витрати</button></div>`:''}
  </div></div>`;
}
function render(){
  $('#dateLine').textContent=new Date().toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
  $('#screenTitle').textContent=tab==='pa'?D.names.a:tab==='pb'?D.names.b:tab==='pn'?'Спільне':(TITLES[tab]||'');
  const cnt={fridge:D.fridge.length,tasks:D.tasks.filter(x=>!x.done).length,habits:D.habits.length,goals:D.goals.filter(x=>x.saved<x.target).length,
    favs:D.favs.length,places:D.places.filter(x=>!x.done).length,talks:D.talks.filter(x=>!x.done).length+D.notes.length,
    wishes:D.wishes.filter(x=>!x.done).length,log:D.log.length};
  const NAV=navList();
  $('#snav').innerHTML=GROUPS.map(([f,t,lab])=>(lab?`<div class="sdiv">${lab}</div>`:'')+
    NAV.slice(f,t).map(([k,n,ic])=>{
      const pic=k==='pa'?AVA.a:k==='pb'?AVA.b:k==='pn'?AVA.n:'';
      return `<button aria-selected="${k===tab}" data-act="go" data-v="${k}">${pic?`<img class="navava" src="${pic}" alt="">`:svg(ic)}${esc(n)}${cnt[k]?`<span class="c">${cnt[k]}</span>`:''}</button>`}).join('')).join('');
    if(tab==='pa'||tab==='pb'||tab==='pn'){
    $('#view').innerHTML=(note?`<div class="warn">${esc(note)}</div>`:'')+(ready?person(tab==='pa'?'a':tab==='pb'?'b':'n'):'');
    badge(); return}
  const v={home,money,goals,meals,fridge,tasks,habits,cal,wishes,places,talks,favs,log,more,settings}[tab]||home;
  let body;
  try{ body=ready?v():'<div class="card"><div class="empty">Завантажую…</div></div>' }
  catch(err){ body='<div class="card"><h2>Помилка розділу «'+esc(TITLES[tab]||tab)+'»</h2><div class="sub" style="word-break:break-word">'+
    esc(err&&err.message||String(err))+'</div><div class="hint">Інші розділи мають працювати — відкрий меню зліва.</div></div>' }
  $('#view').innerHTML=(note?`<div class="warn">${esc(note)}</div>`:'')+body+modalView();
  if(inputSnap){try{restoreInputs(inputSnap)}catch(e){} inputSnap=null;}
  if(refocus){const el=document.getElementById(refocus);
    if(el){try{el.focus();el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}
    refocus=null;}
  const gb=document.querySelector('.gbody');
  if(gb){gb.scrollTop=calScroll; gb.addEventListener('scroll',()=>{calScroll=gb.scrollTop},{passive:true});}
  badge();
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]'); if(!t)return;
  const a=t.dataset.act, num=s=>Math.abs(parseFloat(String((($(s)||{}).value||'')).replace(/\s/g,'').replace(',','.')))||0, val=s=>(($(s)||{}).value||'').trim();
  if(!CLEARS.has(a)){ inputSnap=snapInputs(); (EXCL[a]||[]).forEach(k=>{delete inputSnap[k]}) }
  const nm=k=>whoName(k);
  if(a==='go'){tab=t.dataset.v;note='';sched=null;
    if(tab==='cal'){calAnchor=today();selDay=today()}
    render();window.scrollTo({top:0});
    $('#side').classList.remove('open');$('#backdrop').classList.remove('on');return}
  if(['who','tWho','wWho','gFor','cWho','goalWho','qWho','hWho'].includes(a)){draft[a]=t.dataset.v;render()}
  else if(a==='cat'){draft.cat=t.dataset.v;render()}
  else if(a==='catsEdit'){catsOpen=!catsOpen;render()}
  else if(a==='catAdd'){const n=val('#catNew'); if(!n)return $('#catNew').focus();
    upd(()=>D.cats=cats().concat([n]),`Нова категорія витрат «${n}»`)}
  else if(a==='catDel'){const i=Number(t.dataset.i), list=cats(); if(list.length<2)return;
    const gone=list[i]; upd(()=>{D.cats=list.filter((_,j)=>j!==i);
      D.expenses.forEach(x=>{if(x.cat===gone)x.cat='Інше'})},`Видалено категорію «${gone}»`);
    if(draft.cat===gone)draft.cat=cats()[0]}
  else if(a==='pKind'){draft.pKind=t.dataset.v;render()}
  else if(a==='cType'){draft.cType=t.dataset.v;
    if(draft.cType==='bd'){draft.cAll=true;draft.rMode='year'}
    else if(['job','work','order'].includes(draft.cType)){draft.cAll=false;draft.rMode='none'}
    render()}
  else if(a==='cAll'){draft.cAll=!draft.cAll;render()}
  else if(a==='rMode'){draft.rMode=t.dataset.v;render()}
  else if(a==='cCat'){draft.cCat=t.dataset.v;render()}
  else if(a==='plCat'){draft.plCat=t.dataset.v;render()}
  else if(a==='plRep'){draft.plRep=t.dataset.v;render()}
  else if(a==='addPlan'){const n=val('#plName'), amt=num('#plAmt'), d=val('#plDate')||today();
    if(!n||!amt){note='Впиши назву платежу і суму.';$('#plName').focus();return render()}
    upd(()=>D.cal.push({id:id(),date:d,type:'pay',who:'n',note:n,allDay:false,start:'08:00',end:'09:00',
      amt:amt,cat:draft.plCat,r:{mode:draft.plRep||'month',n:2,on:2,off:2},rep:false}),
      `Платіж «${n}» ${kc(amt)} на ${dm(d)}${(draft.plRep||'month')==='month'?' щомісяця':''}`)}
  else if(a==='payNow'){const c=D.cal.find(z=>z.id===t.dataset.id); if(!c||!c.amt)return;
    upd(()=>D.expenses.push({id:id(),amount:c.amt,cat:c.cat||'Житло',who:c.who==='n'?'n':c.who,
      note:c.note||tName(c.type),date:t.dataset.d||today()}),
      `Платіж «${c.note||tName(c.type)}» ${kc(c.amt)} записано у витрати`)}
  else if(a==='menu'){menuShift+=Number(t.dataset.v);render()}
  else if(a==='calMode'){calMode=t.dataset.v;render()}
  else if(a==='tFilter'){const k=t.dataset.v; hidden.has(k)?hidden.delete(k):hidden.add(k); render()}
  else if(a==='calNav'){const n=Number(t.dataset.v);
    calAnchor=calMode==='day'?addDays(calAnchor,n):calMode==='week'?addDays(calAnchor,7*n):
      calMode==='strip'?addDays(calAnchor,14*n):iso(new Date(new Date(calAnchor.slice(0,8)+'01').setMonth(new Date(calAnchor).getMonth()+n)));
    render()}
  else if(a==='evt'){const it=D.cal.find(z=>z.id===t.dataset.id); if(!it)return;
    selDay=t.dataset.d||it.date;
    modalDraft={id:it.id,date:it.date,note:it.note||'',type:it.type,who:it.who,allDay:!!it.allDay,
      start:it.start||'09:00',end:it.end||'10:00',amt:it.amt||0,cat:it.cat||'Житло',
      rMode:(it.r&&it.r.mode)||(it.rep?'year':'none')};
    render(); ev.stopPropagation()}
  else if(a==='mStop'){ev.stopPropagation()}
  else if(a==='mClose'){modalDraft=null;render()}
  else if(a==='mType'){modalDraft.type=t.dataset.v;render()}
  else if(a==='mWho'){modalDraft.who=t.dataset.v;render()}
  else if(a==='mAll'){modalDraft.allDay=!modalDraft.allDay;render()}
  else if(a==='mRep'){modalDraft.rMode=t.dataset.v;render()}
  else if(a==='mSave'){const m=modalDraft, it=D.cal.find(z=>z.id===m.id); if(!it){modalDraft=null;return render()}
    const nn=val('#mNote'), na=num('#mAmt'), nd=val('#mDate')||m.date;
    modalDraft=null;
    upd(()=>{it.note=nn; it.type=m.type; it.who=m.who; it.allDay=m.allDay; it.date=nd;
      it.start=m.allDay?'':m.start; it.end=m.allDay?'':m.end; it.amt=na; it.cat=m.cat;
      it.r={mode:m.rMode||'none',n:(it.r&&it.r.n)||2,on:(it.r&&it.r.on)||2,off:(it.r&&it.r.off)||2};
      it.rep=m.rMode==='year';}, `Змінено «${nn||tName(m.type)}» ${dm(nd)}`)}
  else if(a==='mDel'){const m=modalDraft; modalDraft=null;
    upd(()=>D.cal=D.cal.filter(z=>z.id!==m.id), `Видалено «${m.note||tName(m.type)}»`)}
  else if(a==='mPay'){const m=modalDraft, it=D.cal.find(z=>z.id===m.id); modalDraft=null;
    if(it&&it.amt)upd(()=>D.expenses.push({id:id(),amount:it.amt,cat:it.cat||'Житло',who:it.who==='n'?'n':it.who,
      note:it.note||tName(it.type),date:selDay||today()}),`Платіж «${it.note||tName(it.type)}» ${kc(it.amt)} у витрати`)}
  else if(a==='slot'){const r=t.getBoundingClientRect();
    const h=Math.max(0,Math.min(23,Math.floor((ev.clientX-r.left)/Math.max(1,r.width)*24)));
    selDay=t.dataset.d; calAnchor=t.dataset.d; draft.cAll=false;
    draft.cStart=String(h).padStart(2,'0')+':00'; draft.cEnd=String((h+1)%24).padStart(2,'0')+':00';
    inputSnap=null; render()}
  else if(a==='cal'){calShift+=Number(t.dataset.v);render()}
  else if(a==='calNow'){calShift=0;calAnchor=today();selDay=today();render()}
  else if(a==='pick'){selDay=t.dataset.d;render()}
  else if(a==='addMark'){const s=draft.cAll?'':draft.cStart,e=draft.cAll?'':draft.cEnd,n=val('#cNote');
    const r={mode:draft.rMode,n:Number((val('#rN')||draft.rN)),on:Number((val('#rOn')||draft.rOn)),off:Number((val('#rOff')||draft.rOff))};
    draft.rN=r.n;draft.rOn=r.on;draft.rOff=r.off;
    const amt=num('#cAmt2');
    upd(()=>D.cal.push({id:id(),date:selDay||today(),type:draft.cType,who:draft.cWho,note:n,allDay:draft.cAll,start:s,end:e,r:r,rep:r.mode==='year',amt:amt,cat:draft.cCat}),
      `Календар: ${tName(draft.cType)}${n?' «'+n+'»':''} ${dm(selDay||today())} ${draft.cAll?'весь день':s+'–'+e}${r.mode!=='none'?' · повтор':''} (${draft.cWho==='n'?'обоє':nm(draft.cWho)})`)}
  else if(a==='qT'){draft.qT=t.dataset.v;render()}
  else if(a==='qAdd'){
    const T=draft.qT||'expense', txt=val('#qText'), amt=num('#qAmt'), qty=val('#qQty'),
          dt=val('#qDate')||today(), tm=val('#qTime')||'09:00', w=draft.who;
    if(T==='expense'){ if(!amt){note='Впиши суму витрати.';$('#qAmt')&&$('#qAmt').focus();return render()}
      upd(()=>D.expenses.push({id:id(),amount:amt,cat:draft.cat,who:w,note:txt,date:today()}),
        `Витрата ${kc(amt)} · ${draft.cat}${txt?' «'+txt+'»':''} (${nm(w)})`); return}
    if(!txt){note='Впиши, що додати.';$('#qText').focus();return render()}
    if(T==='task') upd(()=>D.tasks.push({id:id(),text:txt,who:w,due:val('#qDate')||'',done:false,sub:[]}),`Справа «${txt}» (${nm(w)})`);
    else if(T==='shop') upd(()=>D.shopping.push({id:id(),text:txt,qty:qty,cat:'Інше',done:false}),`Покупки: + ${txt}`);
    else if(T==='fridge') upd(()=>D.fridge.push({id:id(),text:txt,qty:qty,cat:draft.fCat,exp:val('#qDate')||''}),`Холодильник: + ${txt}`);
    else if(T==='habit') upd(()=>D.habits.push({id:id(),title:txt,who:w,done:{}}),`Нова звичка «${txt}»`);
    else if(T==='goal') upd(()=>D.goals.push({id:id(),title:txt,target:amt,saved:0,due:'',contribs:[]}),`Нова ціль «${txt}»`);
    else if(T==='wish') upd(()=>D.wishes.push({id:id(),text:txt,who:w,price:amt,done:false}),`Бажанка «${txt}»`);
    else if(T==='place') upd(()=>D.places.push({id:id(),title:txt,kind:draft.pKind,where:'',price:amt,note:'',done:false}),`Куди піти: «${txt}»`);
    else if(T==='talk') upd(()=>D.talks.push({id:id(),text:txt,who:w,date:today(),answer:'',done:false}),`Питання «${txt}»`);
    else if(T==='event') upd(()=>D.cal.push({id:id(),date:dt,type:'ev',who:w,note:txt,allDay:false,
      start:tm,end:addMin(tm,60),r:{mode:'none'},rep:false}),`Подія «${txt}» ${dm(dt)} ${tm}`);
  }
  else if(a==='addEx'){const v=num('#exAmt');if(!v)return $('#exAmt').focus(); const n=val('#exNote');
    upd(()=>D.expenses.push({id:id(),amount:v,cat:draft.cat,who:draft.who,note:n,date:today()}),
      `Витрата ${kc(v)} · ${draft.cat}${n?' «'+n+'»':''} (${nm(draft.who)})`)}
  else if(a==='glDueSet'){draft.glDue=t.dataset.v;render()}
  else if(a==='addGoal'){const v=val('#glTitle'),tg=num('#glTarget');
    if(!v){note='Впиши назву цілі — суму можна не ставити.';$('#glTitle').focus();return render()}
    upd(()=>D.goals.push({id:id(),title:v,target:tg,saved:0,due:draft.glDue?val('#glDue'):'',contribs:[]}),
      `Нова ціль «${v}»`+(tg?` на ${kc(tg)}`:' (без суми)'))}
  else if(a==='openGoal'){openGoal=openGoal===t.dataset.id?null:t.dataset.id;render()}
  else if(a==='addContrib'){const v=num('#cAmt'),g=D.goals.find(x=>x.id===t.dataset.id);if(!v||!g)return;

    openNote=nid; render()}
  else if(a==='noteOpen'){openNote=openNote===t.dataset.id?null:t.dataset.id;render()}
  else if(a==='addEntry'){const n=D.notes.find(z=>z.id===t.dataset.id), v=val('#ntText');
    if(!n||!v)return; upd(()=>n.entries.push({id:id(),ts:new Date().toISOString(),text:v,who:draft.qWho}),
      `Роздум «${n.title}»: запис від ${nm(draft.qWho)}`);
    const f=$('#ntText'); if(f){f.value='';f.focus()}}
  else if(a==='delEntry'){const n=D.notes.find(z=>z.id===t.dataset.id); if(!n)return;
    upd(()=>n.entries=n.entries.filter(e=>e.id!==t.dataset.e))}
  else if(a==='openTalk'){openTalk=openTalk===t.dataset.id?null:t.dataset.id;render()}
  else if(a==='closeTalk'){const q=D.talks.find(x=>x.id===t.dataset.id);if(!q)return;const ans=val('#qAns');openTalk=null;
    upd(()=>{q.answer=ans;q.done=true},`Вирішено «${q.text}»${ans?': '+ans:''}`)}
  else if(a==='tgl'){const k=t.dataset.k,it=D[k].find(x=>x.id===t.dataset.id);if(!it)return;
    const nmm=it.text||it.title;upd(()=>it.done=!it.done,`${it.done?'Знято':'Виконано'}: ${nmm}`)}
  else if(a==='tglGift'){const it=D.gifts.find(x=>x.id===t.dataset.id);if(!it)return;
    upd(()=>it.bought=!it.bought,`Подарунок «${it.text}» ${it.bought?'не куплено':'куплено'}`)}
  else if(a==='del'){const k=t.dataset.k,it=D[k].find(x=>x.id===t.dataset.id);
    upd(()=>D[k]=D[k].filter(x=>x.id!==t.dataset.id),`Видалено: ${it?(it.text||it.title||it.note||tName(it.type)||'запис'):'запис'}`)}
  else if(a==='sched'){const k=t.dataset.kind,i=t.dataset.id;
    if(sched&&sched.kind===k&&sched.id===i){sched=null}
    else{const src=srcOf(k).find(z=>z.id===i);
      sched={kind:k,id:i,date:today(),all:false,start:k==='habit'?'07:00':'18:00',end:k==='habit'?'08:00':'20:00',
        who:(src&&src.who)||'n',rMode:'none',rN:2,rOn:2,rOff:2}}
    render()}
  else if(a==='schedDate'){sched.date=t.dataset.v;render()}
  else if(a==='schedRep'){sched.rMode=t.dataset.v;render()}
  else if(a==='schedStart'){const d=durOf(sched)||60;sched.all=false;sched.start=t.dataset.v;sched.end=addMin(sched.start,d);render()}
  else if(a==='schedDur'){sched.all=false;sched.end=addMin(sched.start,Number(t.dataset.v));render()}
  else if(a==='schedAll'){sched.all=!sched.all;render()}
  else if(a==='schedWho'){sched.who=t.dataset.v;render()}
  else if(a==='schedGo'){
    const k=sched.kind, src=srcOf(k).find(z=>z.id===sched.id);
    if(!src)return;
    const d=val('#scD')||sched.date, s=sched.all?'':sched.start, e=sched.all?'':sched.end;
    const title=src.text||src.title, w=sched.who;
    const r={mode:sched.rMode||'none',n:Number(val('#scN')||sched.rN),on:Number(val('#scOn')||sched.rOn),off:Number(val('#scOff')||sched.rOff)};
    const ty=k==='habit'?'job':'ev';
    sched=null;
    upd(()=>{D.cal.push({id:id(),date:d,type:ty,who:w,note:title,allDay:!s,start:s,end:e,r:r,rep:false});
      if(k==='task')src.due=d; if(k!=='habit')src.plan=d;},
      `У календар: «${title}» ${dm(d)}${s?' '+s+'–'+e:' весь день'}${r.mode!=='none'?' · повтор':''}`)}
  else if(a==='undo'){doUndo()}
  else if(a==='undoTo'){doUndo(Number(t.dataset.i))}
  else if(a==='redo'){doRedo()}
  else if(a==='clearLog'){if(confirm('Очистити журнал?'))upd(()=>D.log=[])}
  else if(a==='saveSet'){const na=val('#nA')||'Він',nb=val('#nB')||'Вона',l=Math.abs(parseFloat($('#lim').value))||0;
    upd(()=>{D.names.a=na;D.names.b=nb;D.limit=l},`Налаштування: ${na} / ${nb}, ліміт ${kc(l)}`)}
  else if(a==='saveСfgSb'){cfg={url:val('#sbUrl'),key:val('#sbKey')};
    saveCfg();
    note='';push().then(()=>{lg('Підключено Supabase');render()})}
  else if(a==='testSb'){note='Перевіряю зв\'язок…';render();
    pull().then(d=>{note=online?'Supabase відповідає. '+(d?'Дані в базі є.':'База порожня — перший запис створиться при найближчій зміні.')
      :'Немає зв\'язку. Перевір URL, ключ і чи виконано SQL для таблиці couple_state.';render()})}
  else if(a==='notifAsk'){
    if(typeof Notification==='undefined'){note='Цей браузер не вміє сповіщення.';return render()}
    Notification.requestPermission().then(r=>{
      cfg.notif=Object.assign({lead:30},cfg.notif||{},{on:r==='granted'});
      saveCfg();
      note=r==='granted'?'Дозвіл отримано — сповіщення увімкнені.':'Браузер відмовив у дозволі.';render()})}
  else if(a==='notifToggle'){cfg.notif=Object.assign({lead:30},cfg.notif||{}); cfg.notif.on=!cfg.notif.on;
    saveCfg();render()}
  else if(a==='notifLead'){cfg.notif=Object.assign({on:false},cfg.notif||{}); cfg.notif.lead=Number(t.dataset.v);
    saveCfg();render()}
  else if(a==='notifTest'){
    if(typeof Notification==='undefined'||Notification.permission!=='granted'){note='Спершу дай дозвіл.';return render()}
    try{new Notification('Наш штаб',{body:'Так виглядатиме нагадування про подію.'})}catch(e){note='Не вийшло: '+e.message}
    render()}
  else if(a==='ics'){downloadICS()}
  else if(a==='expJson'){
    try{const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
      const el=document.createElement('a'); el.href=URL.createObjectURL(blob);
      el.download='nash-shtab-'+today()+'.json'; document.body.appendChild(el); el.click();
      setTimeout(()=>{URL.revokeObjectURL(el.href);el.remove()},800); note='Копію збережено.';}
    catch(e){note='Не вийшло: '+e.message} render()}
  else if(a==='impPick'){const f=$('#impFile'); if(f)f.click()}
  else if(a==='saveAkey'){cfg.akey=val('#akey');
    saveCfg();note='Ключ збережено.';render()}
  else if(a==='offCfg'){cfg={url:'',key:''};online=false;
    saveCfg();render()}
  else if(a==='wipe'){if(confirm('Стерти всі записи? Відновити не вийде.')){const n=D.names,l=D.limit;upd(()=>{D=def();D.names=n;D.limit=l;lg('Усі дані очищено')})}}
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(['serv','tColor','tName','fcName'].includes(t.dataset.act||t.id)) inputSnap=snapInputs();
  if(t.dataset.act==='meal'){const d=t.dataset.d,sl=t.dataset.s,day=D.meals[d]||{},m=day[sl]||{dish:'',cook:''};
    m.dish=t.value;day[sl]=m;D.meals[d]=day;lg('Меню '+dm(d)+' '+(SLOTS.find(z=>z[0]===sl)||['',''])[1]+': '+(t.value||'—'));save()}
  if(t.dataset.act==='wishText'){D.wishText=t.value; save()}
  if(t.dataset.act==='fixText'){D.fixText=t.value; save()}
  if(t.id==='rFrom'||t.id==='rTo'){const f=(($('#rFrom')||{}).value)||'', t4=(($('#rTo')||{}).value)||'';
    if(f&&t4&&t4>=f){D.range={from:f,to:t4}; D.rev=Date.now(); save(); render()}}
  if(t.dataset.act==='catName'){const i=Number(t.dataset.i),list=cats().slice(),old=list[i];
    list[i]=t.value; D.cats=list; D.expenses.forEach(x=>{if(x.cat===old)x.cat=t.value});
    if(draft.cat===old)draft.cat=t.value; save()}
  if(t.dataset.act==='fcName'){const i=Number(t.dataset.i),list=fcats().slice(),old=list[i];
    list[i]=t.value; D.fcats=list; D.fridge.forEach(f=>{if(f.cat===old)f.cat=t.value});
    if(draft.fCat===old)draft.fCat=t.value; save()}
  if(t.dataset.act==='tName'){const ty=tList().find(z=>z.k===t.dataset.tk); if(ty){ty.name=t.value;D.types=tList();save()}}
  if(t.dataset.act==='tColor'){const ty=tList().find(z=>z.k===t.dataset.tk); if(ty){ty.color=t.value;D.types=tList();save();render()}}
  if(t.dataset.act==='serv'){D.serv=Math.max(1,Math.min(12,Number(t.value)||2));save();render()}
});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;
  const map={shopIn:'addShop',tIn:'addTask',wIn:'addWish',gIn:'addGift',exAmt:'addEx',exNote:'addEx',cNote:'addMark',
    glTitle:'addGoal',glTarget:'addGoal',pIn:'addPlace',pWhere:'addPlace',qIn:'addTalk',hIn:'addHabit',
    fIn:'addFridge',fQty:'addFridge',fExp:'addFridge',favIn:'addFav',fvTitle:'addFav2',plName:'addPlan',plAmt:'addPlan',
    subIn:'addSub',ntTitle:'addNote',hNote:'addHabit',snIn:'addSnack',catNew:'catAdd',fcNew:'fcAdd',tNew:'tAdd',
    fe_t:'fSave',fe_q:'fSave',mNote:'mSave',mAmt:'mSave'};
  const a=map[ev.target.id];if(a)document.querySelector(`[data-act="${a}"]`)?.click()});
$('#gear').addEventListener('click',()=>{tab=tab==='settings'?'home':'settings';render()});
const drawer=v=>{$('#side').classList.toggle('open',v);$('#backdrop').classList.toggle('on',v)};
$('#burger').addEventListener('click',()=>drawer(!$('#side').classList.contains('open')));
$('#backdrop').addEventListener('click',()=>drawer(false));
document.addEventListener('change',ev=>{
  if(ev.target.id!=='impFile'||!ev.target.files||!ev.target.files[0])return;
  const f=ev.target.files[0], rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);
    if(!confirm('Замінити всі поточні дані вмістом копії?'))return;
    D=Object.assign(def(),o); D.rev=Date.now(); lg('Відновлено з копії '+f.name);
    save(); note='Дані відновлено.'; render();}
    catch(e){note='Файл не читається: '+e.message; render()}};
  rd.readAsText(f); ev.target.value='';
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.act==='fq'){draft.fq=el.value; refocus='fq'; inputSnap=snapInputs(); render(); return}
  if(!el.dataset||!el.dataset.tin)return;
  const v=normTime(el.value); if(v) setTime(el.dataset.tin,v);      // без перемальовки — курсор не збивається
});
document.addEventListener('blur',ev=>{
  const el=ev.target; if(!el.dataset||!el.dataset.tin)return;
  const v=normTime(el.value);
  if(v){ setTime(el.dataset.tin,v); el.value=v;
    if(el.dataset.tin==='cS'&&draft.cEnd===draft.cStart) draft.cEnd=addMin(v,60); }
  else { el.value = el.dataset.tin==='cS'?draft.cStart : el.dataset.tin==='cE'?draft.cEnd
        : el.dataset.tin==='scS'?(sched&&sched.start||'') : (sched&&sched.end||''); }
},true);
setTimeout(()=>{ if(!ready){const b=document.getElementById('boot'); if(b)
  b.parentElement.parentElement.innerHTML='<div class="card"><h2>Застрягло на завантаженні</h2>'+
  '<div class="sub">База не відповідає або переглядач блокує запити. Відкрий файл у Safari (найпростіше — залити на netlify.com/drop) '+
  'і перевір, що в Supabase створена таблиця couple_state.</div></div>'; }},9000);
load();
</script>
</body>
</html>
